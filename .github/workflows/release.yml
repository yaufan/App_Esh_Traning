name: Release

# Publishes the version in app.json: tag v<version>, a GitHub Release with
# three Android APKs (arm64 / armv7 / x86_64) and the CHANGELOG.md notes.
# Same flow as yaufan's other apps (release-kids-app), built with Expo
# prebuild + Gradle instead of Flutter.
on:
  # Automatic: a push to main that changes the version releases it once the
  # checks pass. A version that is already released is skipped.
  push:
    branches: [main]
    paths:
      - app.json
      - CHANGELOG.md
      - .github/workflows/release.yml
  # By hand: Actions -> Release -> Run workflow.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

# The fingerprint of the test key the APKs are signed with (the same test key
# as yaufan's other apps, alias kidspaint).
env:
  TEST_KEY_SHA256: 69a4e28c011a4dd37048f43a2d244173250d28c0ff0c723fffbbd229bc57235d
  APK_NAME: esh-training
  APP_TITLE: 職安乙級術科練習

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "::error::v$VERSION is already released. Raise the version in app.json and package.json and add it to CHANGELOG.md."
              exit 1
            fi
            echo "::notice::v$VERSION is already released, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: Build number and release notes
        run: |
          echo "BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          # This version's section of the changelog becomes the release notes.
          awk -v v="$VERSION" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Version, TypeScript, ESLint and the question-bank validator.
      - run: npm run check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The NDK React Native asks for may not be on the runner, so it is cached.
      - name: NDK version
        run: |
          NDK=$(sed -n 's/^ndkVersion = "\(.*\)"/\1/p' node_modules/react-native/gradle/libs.versions.toml)
          if [ -z "$NDK" ]; then echo "::warning::NDK version not found, not cached"; exit 0; fi
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "NDK_DIR=$ANDROID_HOME/ndk/$NDK" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        if: env.NDK != ''
        with:
          path: ${{ env.NDK_DIR }}
          key: android-ndk-${{ env.NDK }}

      # The test key every APK is signed with, from the repository's secrets:
      # the same key every time, so phones can update.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::No ANDROID_KEYSTORE_BASE64 secret (Settings -> Secrets and variables -> Actions -> Repository secrets)"
            exit 1
          fi
          # Spaces and line breaks from pasting the secret are dropped.
          printf '%s' "$KEYSTORE" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/esh-training.p12"
          echo "ESH_TRAINING_KEYSTORE=$RUNNER_TEMP/esh-training.p12" >> "$GITHUB_ENV"

      # versionCode is the commit count, so every release can update the last.
      - name: Android project (expo prebuild)
        run: |
          node -e "
            const fs = require('fs');
            const a = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            a.expo.android.versionCode = Number(process.env.BUILD);
            fs.writeFileSync('app.json', JSON.stringify(a, null, 2));
          "
          npx expo prebuild -p android --no-install --clean
          grep -q "ESH_TRAINING_KEYSTORE" android/app/build.gradle
          grep -q "splits" android/app/build.gradle

      - name: Build Android APKs
        working-directory: android
        env:
          ESH_TRAINING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../build
          # One APK per kind of phone chip.
          for abi in arm64-v8a:arm64 armeabi-v7a:armv7 x86_64:x86_64; do
            mv "app/build/outputs/apk/release/app-${abi%:*}-release.apk" "../build/$APK_NAME-$VERSION-${abi#*:}.apk"
          done
          ls -la ../build

      # Signed with the test key, or a phone with the app on it cannot update.
      - name: Check the signing key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/$APK_NAME-*.apk; do
            CERTS=$("$APKSIGNER" verify --print-certs "$apk")
            if ! grep -q "SHA-256 digest: $TEST_KEY_SHA256" <<< "$CERTS"; then
              echo "::error::$apk is not signed with the test key"
              exit 1
            fi
          done

      # The app works offline and promises no network, location or ads.
      - name: Check Android permissions
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for apk in build/$APK_NAME-*.apk; do
            "$AAPT2" dump permissions "$apk" | tee -a permissions.txt
          done
          if grep -E 'permission.INTERNET|LOCATION|AD_ID' permissions.txt; then
            echo "::error::The APK asks for a permission the app promises not to use"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          if [ "$GITHUB_REF_NAME" != "main" ]; then PRE="--prerelease"; fi
          {
            echo "**下載哪一個？**"
            echo "- 一般手機（大多數 2017 年以後的手機）：\`$APK_NAME-$VERSION-arm64.apk\`"
            echo "- 很舊的手機（上面那個裝不起來的話）：\`$APK_NAME-$VERSION-armv7.apk\`"
            echo "- 電腦上的 Android 模擬器、Intel 的 Chromebook：\`$APK_NAME-$VERSION-x86_64.apk\`"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" build/$APK_NAME-"$VERSION"-*.apk \
            --target "$GITHUB_SHA" --title "$APP_TITLE $VERSION" --notes-file "$RUNNER_TEMP/notes.md" $PRE
